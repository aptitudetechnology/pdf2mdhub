<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF2MD Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@opengovsg/pdf2md@latest/dist/pdf2md.min.js"></script>
    <script src="{{ url_for('static', filename='js/pdf2md.js') }}"></script>
</head>
<body>
    <header class="app-header">
        <nav class="main-nav">
            <a href="/" class="logo">PDF2MD Hub</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('upload_page') }}">Upload</a></li>
                <li><a href="{{ url_for('index') }}">Search</a></li>
                </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>&copy; {{ moment().year }} PDF2MD Hub. All rights reserved.</p>
    </footer>

    <script>
        // Example for dynamic year in footer (requires Flask-Moment or similar if rendered server-side)
        // If rendered purely client-side, use JS Date object
        document.addEventListener('DOMContentLoaded', () => {
            const currentYearSpan = document.querySelector('.app-footer p');
            if (currentYearSpan && currentYearSpan.textContent.includes('{{ moment().year }}')) {
                currentYearSpan.textContent = currentYearSpan.textContent.replace('{{ moment().year }}', new Date().getFullYear());
            }
        });
    </script>
</body>
</html>
