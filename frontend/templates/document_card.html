<div class="document-card">
    <div class="card-thumbnail">
        <img src="{{ doc.thumbnail_url if doc.thumbnail_url else url_for('static', filename='images/default_pdf_thumbnail.png') }}" alt="Document Thumbnail">
    </div>
    <div class="card-content">
        <h4 class="card-title">{{ doc.title }}</h4>
        <p class="card-summary">{{ doc.summary if doc.summary else 'No summary available.' }}</p>
        <div class="card-tags">
            {% if doc.tags %}
                {% for tag in doc.tags.split(',') %}
                    <span class="tag">{{ tag.strip() }}</span>
                {% endfor %}
            {% else %}
                <span class="tag no-tag">No Tags</span>
            {% endif %}
        </div>
        <a href="{{ url_for('view_document', document_id=doc.id) }}" class="card-link">View Document</a>
    </div>
</div>
