version: '3.8'
services:
  app:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/pdf2mdhub
    depends_on:
      - postgres
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pdf2mdhub
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # This mounts your local init_postgres.sh into the container's init directory
      - ./db/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh
      - pgdata:/var/lib/postgresql/data
          
volumes:
  pgdata:
